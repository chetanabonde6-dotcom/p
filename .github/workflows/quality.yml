name: Frontend checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check api.js
          node --check tests/api.test.cjs
      - name: Check data adapter behavior
        run: node tests/api.test.cjs
